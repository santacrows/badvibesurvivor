<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bad Vibe Survivor</title>
<style>
/* Base Theme Tokens - Dark Mode Only */
:root {
  --bg: #0a0a0a;
  --obstacle: #282828;
  --fg: #e8e8e8;
  --card: #1c1c1c;
  --flash: #666;
  --player: #3b82f6;
  --gem: #60a5fa;
  --shot: #2563eb;
  --shot2: #93c5fd;
  --shot3: #1d4ed8;
  --e1: #ef4444;
  --e2: #dc2626;
  --e3: #f87171;
  --e4: #b91c1c;
  --e5: #991b1b;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
}

html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.4 system-ui, -apple-system, sans-serif;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
#c { display: block; width: 100%; height: 100%; }
#ov {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));
  background: color-mix(in srgb, var(--bg) 75%, transparent);
  overflow: auto;
  z-index: 10;
}
.panel {
  background: var(--card);
  border: 1px solid var(--obstacle);
  border-radius: 16px;
  padding: 24px;
  max-width: 840px;
  width: 96%;
  text-align: center;
  box-shadow: 0 12px 36px rgba(0,0,0,0.25);
}

/* Title Card Specifics */
#ov.title-mode { background: var(--bg); }
#ov.title-mode .panel { border: none; box-shadow: none; background: transparent; max-width: 600px; padding: 0; }
#ov.title-mode h1 { font-size: 3.8rem; text-transform: uppercase; letter-spacing: -2px; margin-bottom: 2rem; color: var(--fg); text-shadow: 2px 2px 0 rgba(0,0,0,0.15); }

h1, h2 { margin: 0 0 12px; }
p { margin: 6px 0 16px; opacity: .85; }
button { font: inherit; color: inherit; cursor: pointer; }
.go {
  background: var(--fg);
  color: var(--bg);
  border: 0;
  border-radius: 12px;
  padding: 14px 36px;
  font-weight: 700;
  font-size: 1.1rem;
  transition: transform 0.1s, opacity 0.1s;
}
.go:hover { transform: scale(1.04); }
.go:active { transform: scale(0.96); }

/* Force exact 3x1 Grid Row for Choices */
.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  justify-content: center;
  margin-top: 16px;
}
.card {
  display: flex;
  flex-direction: column;
  gap: 6px;
  text-align: left;
  background: var(--bg);
  border: 2px solid var(--obstacle);
  border-radius: 14px;
  padding: 14px 12px;
  transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s;
}
.card:hover, .card:focus-visible {
  border-color: var(--fg);
  outline: 0;
  transform: translateY(-3px);
  box-shadow: 0 6px 16px rgba(0,0,0,0.15);
}
.card em { font-style: normal; font-size: 11px; opacity: .7; text-transform: uppercase; letter-spacing: 0.5px; }
.card span { font-size: 12px; opacity: 0.9; line-height: 1.35; }
.card small { opacity: .5; font-weight: bold; }
.card-icon { width: 36px; height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--fg); }

@media (max-width: 640px) {
  .cards { gap: 6px; }
  .card { padding: 10px 8px; }
  .card-icon { width: 28px; height: 28px; }
  .card span { font-size: 11px; }
}

/* Shape Gallery Showcase Grid */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
  gap: 10px;
  max-height: 62vh;
  overflow-y: auto;
  padding: 6px;
  margin-top: 10px;
}
.gallery-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  background: var(--bg);
  border: 1px solid var(--obstacle);
  border-radius: 12px;
  padding: 10px 4px;
}
.gallery-card canvas { width: 64px; height: 64px; display: block; }
.gallery-card span { font-size: 10px; font-weight: 700; margin-top: 6px; text-transform: capitalize; color: var(--fg); opacity: 0.9; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ov"></div>
<script>
'use strict';
const TAU = Math.PI * 2, $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d'), ov = $('ov');
const rnd = (a, b) => a + Math.random() * (b - a);
const fmt = s => (s / 60 | 0) + ':' + String(s % 60 | 0).padStart(2, '0');

/* ============ CONFIG ============ */
const CFG = {
  player: { r: 18, speed: 192.5, hp: 100, magnet: 70, iframes: .4 },
  spawn: { base: 1.2, ramp: .025, cap: 666, bossEvery: 90 },
  scale: { hp: .05, dmg: .03, spd: .004, spawn: .15 },
  enemySpeed: 1.2,
  attack: { size: 1, power: 1 },
  xpBase: 5, xpStep: 6,
  cell: 56, maxEnemyR: 44
};

/* ALL AVAILABLE SHAPES (30 Total) */
const ALL_SHAPES = [
  0, 3, 4, 5, 6, 7, 8, 'star', 'cross', 'trapezoid', 'house', 'arrow', 'ghost',
  'diamond', 'crescent', 'heart', 'shield', 'drop', 'hourglass', 'clover', 'gear', 'capsule',
  'infinity', 'spade', 'club', 'flower', 'star4', 'star6', 'astroid', 'ring'
];

/* ============ ENEMIES ============ */
const ENEMIES = {
  tri:     { sides: 3, r: 9,  hp: 5,   spd: 80,  dmg: 6,  xp: 1,  col: '--e1', from: 0,   w: 10, spin: 0 },
  sq:      { sides: 4, r: 12, hp: 14,  spd: 55,  dmg: 9,  xp: 2,  col: '--e2', from: 50,  w: 6,  spin: 1 },
  dart:    { sides: 'arrow', r: 7,  hp: 6,   spd: 130, dmg: 7,  xp: 2,  col: '--e4', from: 120, w: 3,  spin: 0 },
  weave:   { sides: 'trapezoid', r: 10, hp: 9,   spd: 70,  dmg: 7,  xp: 2,  col: '--e1', from: 80,  w: 4,  spin: 0, move: 'zig' },
  lunge:   { sides: 'cross', r: 11, hp: 16,  spd: 65,  dmg: 14, xp: 3,  col: '--e5', from: 150, w: 3,  spin: 0, move: 'dash' },
  flit:    { sides: 'drop', r: 8,  hp: 7,   spd: 85,  dmg: 6,  xp: 2,  col: '--e4', from: 100, w: 4,  spin: 0, move: 'flit' },
  hex:     { sides: 6, r: 18, hp: 60,  spd: 38,  dmg: 14, xp: 6,  col: '--e3', from: 200, w: 2,  spin: -.8 },
  orbiter: { sides: 'capsule', r: 8,  hp: 8,   spd: 95,  dmg: 6,  xp: 2,  col: '--e3', from: 180, w: 3,  spin: 2,  move: 'circle' },
  hopper:  { sides: 'house', r: 11, hp: 20,  spd: 70,  dmg: 9,  xp: 3,  col: '--e2', from: 240, w: 3,  spin: 0,  move: 'hop' },
  wraith:  { sides: 'ghost', r: 13, hp: 16,  spd: 60,  dmg: 8,  xp: 3,  col: '--e4', from: 300, w: 3,  spin: 0,  move: 'ghost', fly: 1 },
  boss:    { sides: 'star', r: 44, hp: 500, spd: 45,  dmg: 25, xp: 40, col: '--e5', from: 1e9, w: 0,  spin: .4, boss: 1 }
};

/* ============ ENEMY MOVES ============ */
const MOVES = {
  chase: (e, a) => { e.ma = a; e.sm = 1; },
  zig:   (e, a) => { e.ma = a + Math.sin(t * 5 + e.id) * 1.1; e.sm = 1; },
  dash:  (e, a, dt) => {
    e.tm -= dt;
    if (!e.dashState) e.dashState = 'rest';
    if (e.tm <= 0) {
      if (e.dashState === 'rest') {
        e.dashState = 'charge'; e.tm = 0.55; e.da = a;
      } else if (e.dashState === 'charge') {
        e.dashState = 'burst'; e.tm = 0.45;
      } else if (e.dashState === 'burst') {
        e.dashState = 'recover'; e.tm = 0.8;
      } else {
        e.dashState = 'rest'; e.tm = rnd(1.4, 2.2);
      }
    }
    if (e.dashState === 'charge') { e.ma = e.da; e.sm = 0.25; }
    else if (e.dashState === 'burst') { e.ma = e.da; e.sm = 10.0; }
    else if (e.dashState === 'recover') { e.ma = e.da; e.sm = 0.15; }
    else { e.ma = a; e.sm = 0.9; }
  },
  flit:  (e, a, dt) => {
    e.tm -= dt;
    if (e.tm <= 0) { e.tm = rnd(.2, .6); e.off = rnd(-2.4, 2.4); }
    e.ma = a + e.off; e.sm = 1.2;
  },
  circle: (e, a) => { e.ma = a + (Math.hypot(pl.x - e.x, pl.y - e.y) > 170 ? 1.2 : .35); e.sm = 1; },
  hop:    (e, a) => { e.ma = a; e.sm = ((t + e.id * .37) % 1) < .3 ? 3.3 : 0; },
  ghost:  (e, a) => { e.ma = a + Math.sin(t * 2 + e.id) * .7; e.sm = .6 + .9 * Math.abs(Math.sin(t * .8 + e.id)); }
};

/* ============ WEAPONS ============ */
const WEAPONS = {
  windmill: { name: 'Windmill', max: 7, sym: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 12L12 2M12 12L20 17M12 12L4 17"/><path d="M12 2L16 6M20 17L16 21M4 17L8 13"/></svg>', desc: 'Three rotating katana blades slice through all enemies in their path.',
    tick(w, dt) {
      w.a = (w.a || 0) + dt * (3.2 + 0.35 * w.lv);
      const n = 3, R = 55 + 7.5 * w.lv, bw = 12 + 2 * w.lv;
      if ((w.t = (w.t || 0) - dt) <= 0) {
        w.t = 0.12;
        query(pl.x, pl.y, R, e => {
          const ex = e.x - pl.x, ey = e.y - pl.y;
          for (let i = 0; i < n; i++) {
            const a = w.a + i * TAU / n;
            const dxLine = Math.cos(a) * R, dyLine = Math.sin(a) * R;
            let tProj = (ex * dxLine + ey * dyLine) / (R * R);
            if (tProj >= 0 && tProj <= 1) {
              const px = tProj * dxLine, py = tProj * dyLine;
              if (Math.hypot(ex - px, ey - py) < bw + e.r) {
                hurt(e, 5 + 2 * w.lv);
                break;
              }
            }
          }
        });
      }
    } },
  punch: { name: 'Punch', max: 7, sym: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 11V6a2 2 0 0 0-4 0v1a2 2 0 0 0-4 0V4a2 2 0 0 0-4 0v7a6 6 0 0 0 12 0z"/><path d="M6 14v4a2 2 0 0 0 2 2h7a4 4 0 0 0 4-4v-3"/></svg>', desc: 'High-risk close jabs with massive damage.',
    tick(w, dt) {
      if ((w.t -= dt) > 0) return;
      const tg = nearest(); if (!tg || Math.hypot(tg.x - pl.x, tg.y - pl.y) > 95 + 5 * w.lv) return;
      w.t = Math.max(.28, .65 - .06 * w.lv) * P.cd;
      swing(Math.atan2(tg.y - pl.y, tg.x - pl.x), 75 + 6 * w.lv, 1.4, 28 + 9 * w.lv, 450, '--shot3');
    } },
  whip: { name: 'Whip', max: 7, sym: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 18C7 6 13 6 15 12C17 18 21 15 21 10"/><path d="M20 7l2 3-3 1"/></svg>', desc: 'Lashes front and back arcs for heavy melee damage.',
    tick(w, dt) {
      if ((w.t -= dt) > 0) return;
      w.t = Math.max(.4, 1.0 - .09 * w.lv) * P.cd;
      const tg = nearest(), a = (tg ? Math.atan2(tg.y - pl.y, tg.x - pl.x) : pl.face) + ((w.flip ^= 1) ? 0 : Math.PI);
      swing(a, 115 + 14 * w.lv, 1.2, 24 + 7 * w.lv, 180, '--shot');
    } },
  aura: { name: 'Aura', max: 7, sym: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-dasharray="2 2"/><circle cx="12" cy="12" r="5"/></svg>', desc: 'Continuous aura that shreds foes at point-blank.',
    tick(w, dt) {
      w.r = 65 + 15 * w.lv;
      if ((w.t -= dt) > 0) return;
      w.t = 0.18;
      query(pl.x, pl.y, w.r, e => {
        if (Math.hypot(e.x - pl.x, e.y - pl.y) < w.r + e.r) hurt(e, 7 + 3.2 * w.lv);
      });
    } },
  scythe: { name: 'Soul Scythe', max: 7, sym: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 22L16 4"/><path d="M16 4a8 8 0 0 1-12 8"/></svg>', desc: 'Sweeps a devastating blade in a random 270 degree arc.',
    tick(w, dt) {
      if ((w.t -= dt) > 0) return;
      w.t = Math.max(1.0, 2.5 - .2 * w.lv) * P.cd;
      swing(rnd(0, TAU), 110 + 15 * w.lv, Math.PI * 1.5, 32 + 10 * w.lv, 250, '--shot3');
    } },
  slimetrail: { name: 'Slime Trail', max: 7, sym: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" fill="currentColor" fill-opacity="0.2"/><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>', desc: 'Leaves sticky slime puddles that damage & slow foes by 50%.',
    tick(w, dt) {
      if ((w.t -= dt) > 0 || !pl.moving) return;
      w.t = .18 * P.cd;
      zones.push({ x: pl.x, y: pl.y, r: 18 + 3 * w.lv, life: 2.2 + .3 * w.lv, max: 2.2 + .3 * w.lv, tk: 0, dmg: 5 + 2 * w.lv, slow: true });
    } },
  mines: { name: 'Mines', max: 7, sym: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 2v3m0 14v3m10-10h-3M5 12H2m14.07-7.07l-2.12 2.12M7.05 16.95l-2.12 2.12m14.14 0l-2.12-2.12M7.05 7.05L4.93 4.93"/></svg>', desc: 'Drops heavy proximity landmines.',
    tick(w, dt) {
      if ((w.t -= dt) > 0 || !pl.moving) return;
      w.t = Math.max(.5, 1.2 - .1 * w.lv) * P.cd;
      minesArr.push({ x: pl.x, y: pl.y, r: 45 + 10 * w.lv, trig: 28, dmg: 35 + 12 * w.lv, life: 10 });
    } },
  orbit: { name: 'Orbit', max: 7, sym: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4" fill="currentColor"/><circle cx="12" cy="12" r="9" stroke-dasharray="3 3"/><circle cx="21" cy="12" r="2" fill="currentColor"/></svg>', desc: 'Orbs circle twice as fast around you.',
    tick(w, dt) {
      w.a = (w.a || 0) - dt * (4.4 + .4 * w.lv);
      const n = 1 + Math.ceil(w.lv / 2), R = 72 + 6 * w.lv, OR = 9 * CFG.attack.size;
      for (let i = 0; i < n; i++) {
        const a = w.a + i * TAU / n, x = pl.x + Math.cos(a) * R, y = pl.y + Math.sin(a) * R;
        orbs.push({ x, y, r: OR });
        query(x, y, OR, e => { if (e.oc <= 0 && Math.hypot(e.x - x, e.y - y) < e.r + OR) { hurt(e, 10 + 4 * w.lv); e.oc = .3; } });
      }
    } },
  pulse: { name: 'Pulse', max: 7, sym: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3" fill="currentColor"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="11"/></svg>', desc: 'Shockwave knocking surrounding foes back.',
    tick(w, dt) {
      if ((w.t -= dt) > 0) return;
      w.t = Math.max(1.1, 3.0 - .3 * w.lv) * P.cd;
      rings.push({ x: pl.x, y: pl.y, r: 10, max: (85 + 16 * w.lv) * CFG.attack.size, dmg: 16 + 6 * w.lv, hit: new Set() });
    } },
  mace: { name: 'Mace', max: 7, sym: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="7" r="4"/><path d="M12 11v8"/><circle cx="12" cy="19" r="2"/></svg>', desc: 'Swings a heavy spiked iron mace and chain around you.',
    tick(w, dt) {
      w.a = (w.a || 0) + dt * (1.8 + 0.25 * w.lv);
      const r = 120 + 20 * w.lv;
      const ballR = 16 + 3 * w.lv;
      const mx = pl.x + Math.cos(w.a) * r, my = pl.y + Math.sin(w.a) * r;
      const dxLine = Math.cos(w.a) * r, dyLine = Math.sin(w.a) * r;
      if ((w.t -= dt) <= 0) {
        w.t = 0.1;
        query(pl.x, pl.y, r + ballR, e => {
          const dx = e.x - mx, dy = e.y - my, distToBall = Math.hypot(dx, dy);
          if (distToBall < ballR + e.r) {
            hurt(e, 14 + 5 * w.lv);
            const d = distToBall || 1;
            e.kx += (dx / d) * 240; e.ky += (dy / d) * 240;
          } else {
            const ex = e.x - pl.x, ey = e.y - pl.y;
            let tProj = (ex * dxLine + ey * dyLine) / (r * r);
            if (tProj >= 0 && tProj <= 1) {
              const px = tProj * dxLine, py = tProj * dyLine;
              if (Math.hypot(ex - px, ey - py) < 8 + e.r) {
                hurt(e, 5.5 + 2 * w.lv);
                const d = Math.hypot(ex, ey) || 1;
                e.kx += (ex / d) * 90; e.ky += (dy / d) * 90;
              }
            }
          }
        });
      }
    } },
  spikering: { name: 'Spike Ring', max: 7, sym: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2l2 4-2 2-2-2zM12 22l-2-4 2-2 2 2zM2 12l4-2 2 2-2 2zM22 12l-4 2-2-2 2-2z"/></svg>', desc: 'Fires a ring of outward-flying spikes.',
    tick(w, dt) {
      if ((w.t -= dt) > 0) return;
      w.t = Math.max(.8, 2.0 - .18 * w.lv) * P.cd;
      const n = 8 + 2 * w.lv;
      for (let i = 0; i < n; i++) shoot(i * TAU / n, 280, 5, 12 + 4 * w.lv, 1, 0.9, '--shot', { sides: 3, rot: i * TAU / n });
    } },
  whirlwind: { name: 'Whirlwind', max: 7, sym: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M6 11h12M8 16h8M11 21h2"/></svg>', desc: 'Summons wandering pentagon tornadoes that push back foes.',
    tick(w, dt) {
      if ((w.t -= dt) > 0) return;
      w.t = Math.max(1.0, 2.5 - .2 * w.lv) * P.cd;
      const a = rnd(0, TAU);
      shoot(a, 120, 28, 18 + 5 * w.lv, 99, 2.5, '--shot2', { sides: 5, spin: 6, wander: 3 });
    } },
  shards: { name: 'Shards', max: 7, sym: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></svg>', desc: 'Bursts of sharp shards flying in all directions.',
    tick(w, dt) {
      if ((w.t -= dt) > 0) return;
      w.t = Math.max(.9, 2.2 - .2 * w.lv) * P.cd;
      const n = 5 + w.lv; w.rot = (w.rot || 0) + .3;
      for (let i = 0; i < n; i++) shoot(w.rot + i * TAU / n, 260, 4, 9 + 2.5 * w.lv, 1, .8 + .05 * w.lv, '--shot2', { sides: 3, rot: w.rot + i * TAU / n });
    } },
  needles: { name: 'Needle Storm', max: 7, sym: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M2 12h20M5 5l14 14M19 5L5 19"/></svg>', desc: 'Rapid needle bursts in 8 directional streams.',
    tick(w, dt) {
      if ((w.t -= dt) > 0) return;
      w.t = Math.max(.35, .85 - .08 * w.lv) * P.cd;
      const a0 = rnd(0, TAU);
      for (let i = 0; i < 8; i++) shoot(a0 + i * TAU / 8, 480, 3, 7 + 2 * w.lv, 1, 0.7, '--shot', { sides: 3, rot: a0 + i * TAU / 8 });
    } },
  axe: { name: 'Axe', max: 7, sym: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 10L4 20"/><path d="M13 4a5 5 0 0 1 5 5c0 2-1.5 3.5-3 4l-4-4c.5-1.5 2-3 4-3z"/><path d="M10 7a5 5 0 0 0-5 5c0 2 1.5 3.5 3 4l4-4c-.5-1.5-2-3-4-3z"/></svg>', desc: 'High spinning axes piercing on the drop.',
    tick(w, dt) {
      if ((w.t -= dt) > 0) return;
      w.t = Math.max(.7, 1.6 - .15 * w.lv) * P.cd;
      const n = 1 + (w.lv >= 3) + (w.lv >= 5);
      for (let i = 0; i < n; i++) shoot(-Math.PI / 2 + rnd(-.45, .45), 400, 11, 14 + 5 * w.lv, 99, 1.8, '--shot2', { grav: 750, sides: 3, spin: 12 });
    } },

/* ============ SPATIAL GRID ============ */
const gk = (x, y) => ((x & 0xffff) << 16) | (y & 0xffff);
function gridBuild() {
  grid.clear();
  for (const e of enemies) {
    const k = gk(Math.floor(e.x / CFG.cell), Math.floor(e.y / CFG.cell));
    let a = grid.get(k); if (!a) grid.set(k, a = []); a.push(e);
  }
}
function query(x, y, r, fn) {
  const c = CFG.cell, R = r + CFG.maxEnemyR;
  const x0 = Math.floor((x - R) / c), x1 = Math.floor((x + R) / c), y0 = Math.floor((y - R) / c), y1 = Math.floor((y + R) / c);
  for (let i = x0; i <= x1; i++) for (let j = y0; j <= y1; j++) {
    const a = grid.get(gk(i, j)); if (a) for (const e of a) if (!e.dead) fn(e);
  }
}

/* ============ TERRAIN ============ */
const CHUNK = 520, chunks = new Map();
function chunkAt(i, j) {
  const k = gk(i, j); let c = chunks.get(k); if (c) return c;
  let s = (i * 374761393 + j * 668265263) | 0;
  const r = () => { s = (s + 0x6D2B79F5) | 0; let x = Math.imul(s ^ (s >>> 15), 1 | s); x ^= x + Math.imul(x ^ (x >>> 7), 61 | x); return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
  c = [];
  
  const placeRect = (w, h) => {
    let x = i * CHUNK + 10 + r() * (CHUNK - 20 - w);
    let y = j * CHUNK + 10 + r() * (CHUNK - 20 - h);
    if (Math.hypot(x + w/2, y + h/2) > 260 + Math.max(w,h)/2) c.push({ x, y, w, h });
  };
  const placeCirc = (rad) => {
    let x = i * CHUNK + rad + r() * (CHUNK - rad * 2);
    let y = j * CHUNK + rad + r() * (CHUNK - rad * 2);
    if (Math.hypot(x, y) > 260 + rad) c.push({ type: 'circle', x, y, r: rad });
  };

  let stg = stageType;
  if (stg === 1) {
    for(let q=0, n=(r()<.6?1+(r()<.4):0); q<n; q++) placeCirc(80 + r()*100);
  } else if (stg === 2) {
    for(let q=0, n=(r()<.9?3+(r()<.5)*3+(r()<.25)*4:0); q<n; q++) placeRect(20+r()*25, 20+r()*25);
  } else if (stg === 3) {
    for(let q=0, n=(r()<.8?1+(r()<.4):0); q<n; q++) { let L=300+r()*150, T=30+r()*20; r()<.5 ? placeRect(L,T) : placeRect(T,L); }
  } else if (stg === 4) {
    for(let q=0, n=4+(r()*6|0); q<n; q++) placeCirc(15+r()*15);
  } else if (stg === 5) {
    if(r()<.7) placeCirc(60+r()*60);
    if(r()<.7) placeRect(80+r()*80, 80+r()*80);
  } else if (stg === 6) {
    if(r()<.4) placeRect(180+r()*100, 180+r()*100);
  } else if (stg === 7) {
    for(let q=0, n=2+(r()*3|0); q<n; q++) placeRect(60+r()*40, 60+r()*40);
  } else if (stg === 8) {
    if(r()<.6) { 
      let cx = i*CHUNK+CHUNK/2, cy = j*CHUNK+CHUNK/2;
      if(Math.hypot(cx,cy) > 350) { 
        c.push({x:cx-100, y:cy-25, w:200, h:50}); 
        c.push({x:cx-25, y:cy-100, w:50, h:200}); 
      }
    }
  } else {
    for (let q=0, n=(r()<.8?1+(r()<.5)+(r()<.25):0); q<n; q++) {
      const kind = r(); let w, h;
      if (kind < .35) w = h = 60 + r() * 70; else { const L = 120 + r() * 200, T = 30 + r() * 16; [w, h] = kind < .7 ? [L, T] : [T, L]; }
      placeRect(w, h);
    }
  }
  chunks.set(k, c); return c;
}

function collide(o, rad) {
  for (const b of chunkAt(Math.floor(o.x / CHUNK), Math.floor(o.y / CHUNK))) {
    if (b.type === 'circle') {
      const dx = o.x - b.x, dy = o.y - b.y, d = Math.hypot(dx, dy);
      const minDist = rad + b.r;
      if (d < minDist && d > .001) {
        o.x = b.x + (dx / d) * minDist;
        o.y = b.y + (dy / d) * minDist;
      }
    } else {
      const dx = o.x - Math.max(b.x, Math.min(o.x, b.x + b.w)), dy = o.y - Math.max(b.y, Math.min(o.y, b.y + b.h)), d = Math.hypot(dx, dy);
      if (d >= rad) continue;
      if (d > .001) { o.x += dx / d * (rad - d); o.y += dy / d * (rad - d); }
      else {
        const l = o.x - b.x, rr = b.x + b.w - o.x, tp = o.y - b.y, bt = b.y + b.h - o.y, m = Math.min(l, rr, tp, bt);
        if (m === l) o.x = b.x - rad; else if (m === rr) o.x = b.x + b.w + rad; else if (m === tp) o.y = b.y - rad; else o.y = b.y + b.h + rad;
      }
    }
  }
}

/* ============ HELPERS ============ */
function nearest(x = pl.x, y = pl.y) {
  let b = null, bd = 1e12;
  for (const e of enemies) { if (e.dead) continue; const d = (e.x - x) ** 2 + (e.y - y) ** 2; if (d < bd) { bd = d; b = e; } }
  return b;
}
function shoot(a, sp, r, dmg, pierce, life, col, extra) {
  projs.push({ x: pl.x, y: pl.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, sp, r: r * CFG.attack.size, dmg, pierce, life, col, hit: [], age: 0, ...extra });
}
function swing(a, range, arc, dmg, kb, col) {
  slashes.push({ a, range, arc, life: .18, max: .18, col });
  query(pl.x, pl.y, range, e => {
    const dx = e.x - pl.x, dy = e.y - pl.y, d = Math.hypot(dx, dy) || 1;
    if (d > range + e.r) return;
    const b = Math.atan2(dy, dx) - a, da = Math.abs(Math.atan2(Math.sin(b), Math.cos(b)));
    if (d < e.r + 20 || da < arc / 2 + Math.atan2(e.r, d)) { hurt(e, dmg); e.kx += dx / d * kb; e.ky += dy / d * kb; }
  });
}
function burst(x, y, col, n) {
  for (let i = 0; i < n && parts.length < 400; i++) { const a = rnd(0, TAU), s = rnd(40, 160); parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .4, col }); }
}

function hurt(e, d) {
  if (e.dead) return;
  e.hp -= d * P.dmg * CFG.attack.power; e.flash = .08;
  if (e.maxHp) e.r = Math.max(3, e.baseR * Math.sqrt(Math.max(0, e.hp) / e.maxHp));
  if (e.hp <= 0) {
    e.dead = true; kills++;
    gems.push({ x: e.x, y: e.y, v: e.type.xp });
    if (gems.length > 600) pl.xp += gems.shift().v;
    burst(e.x, e.y, e.type.col, e.type.boss ? 24 : 5);
  }
}
function pickType() {

  return pool[0];
}

  const canGetNewWeapon = ownedWeaponsCount < 5;

  const all = [
    ...Object.entries(WEAPONS).map(([k, d]) => ({ k, d, type: 'w' })),
    ...Object.entries(PASSIVES).map(([k, d]) => ({ k, d, type: 'p' }))
  ].filter(o => {
    const currentLv = pl.lv[o.k] || 0;
    if (currentLv >= o.d.max) return false;
    if (o.type === 'w') {
      const isOwned = pl.ws[o.k] !== undefined;
      if (!isOwned && !canGetNewWeapon) return false;
    }
    return true;
  });

  for (let i = all.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [all[i], all[j]] = [all[j], all[i]]; }
  return all.slice(0, 3);
}

function pick(k, type) {
  pl.lv[k] = (pl.lv[k] || 0) + 1;
  if (type === 'w') (pl.ws[k] = pl.ws[k] || { t: 0 }).lv = pl.lv[k]; else PASSIVES[k].fn();
}

function offer() {
  opts = choices();
  if (!opts.length) { pl.hp = P.maxHp; state = 'play'; return; }
  ov.classList.remove('title-mode');
  show('<h2>Level ' + pl.level + '</h2><div class="cards">' + opts.map((o, i) => {
    const l = pl.lv[o.k] || 0;
    return '<button class="card" data-i="' + i + '"><div style="display:flex;align-items:center;gap:8px;"><div class="card-icon">' + o.d.sym + '</div><div><small>' + (i + 1) + '</small><br><b style="font-size:0.95rem;">' + o.d.name + '</b></div></div><em>' + (o.type === 'w' ? 'Weapon' : 'Passive') + ', ' + (l ? 'lv ' + l + ' → ' + (l + 1) : 'new') + '</em><span>' + o.d.desc + '</span></button>';
  }).join('') + '</div>');
}

function choose(i) { const o = opts[i]; if (!o) return; pick(o.k, o.type); hide(); state = 'play'; }

/* ============ UI ============ */
function show(html) { ov.innerHTML = '<div class="panel">' + html + '</div>'; ov.style.display = 'flex'; }
function hide() { ov.style.display = 'none'; }
function menu() {
  state = 'menu';
  ov.classList.add('title-mode');
  show('<h1>Bad Vibe Survivor</h1><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;"><button class="go" data-act="start">BEGIN</button><button class="go" data-act="gallery" style="background:var(--card);color:var(--fg);border:1px solid var(--obstacle);">SHAPES</button></div>');
}

function showGallery() {
  state = 'gallery';
  ov.classList.remove('title-mode');
  const items = ALL_SHAPES.map((s, i) => {
    const label = typeof s === 'number' ? (s === 0 ? 'Circle' : s + '-Gon') : s;
    return `<div class="gallery-card"><canvas class="shape-preview" width="64" height="64" data-shape="${s}"></canvas><span>#${i+1} ${label}</span></div>`;
  }).join('');
  show(`<div style="display:flex;justify-content:space-between;align-items:center;"><h2>Shape Pool (30 Shapes)</h2><button class="go" data-act="menu" style="padding:6px 18px;font-size:0.95rem;">Back</button></div><div class="gallery-grid">${items}</div>`);
}

function renderGalleryPreviews() {
  const elems = document.querySelectorAll('.shape-preview');
  if (!elems.length) return;
  elems.forEach(canvas => {
    const s = canvas.dataset.shape;
    const shapeVal = isNaN(s) ? s : +s;
    const cCtx = canvas.getContext('2d');
    cCtx.clearRect(0, 0, 64, 64);
    cCtx.fillStyle = C['--player'] || '#3b82f6';
    cCtx.strokeStyle = C['--fg'] || '#e8e8e8';
    cCtx.lineWidth = 1.5;
    cCtx.save();
    polyPath(32, 32, 20, shapeVal, t * 1.2, cCtx);
    cCtx.fill();
    cCtx.stroke();
    cCtx.restore();
  });
}

function end() {
  state = 'over';
  ov.classList.remove('title-mode');
  if (t > best) { best = t; try { localStorage.setItem('ss-best', best); } catch (e) {} }
  show('<h2>You were overrun</h2><p>Survived ' + fmt(t) + ' with ' + kills + ' kills at level ' + pl.level + '.<br>Best time: ' + fmt(best) + '</p><button class="go" data-act="restart">Restart</button>');
}

function togglePause() {
  if (state === 'play') { state = 'pause'; show('<h2>Paused</h2><button class="go" data-act="resume">Resume</button>'); }
  else if (state === 'pause') { hide(); state = 'play'; }
}

function start() {
  stageType = Math.floor(Math.random() * 9);
  chunks.clear(); grid.clear();
  t = 0; kills = 0; acc = 0; nid = 0; nextBoss = CFG.spawn.bossEvery;
  enemies = []; projs = []; gems = []; parts = []; rings = []; orbs = []; blasts = []; zones = []; slashes = []; zaps = []; minesArr = [];
  
  const pShape = ALL_SHAPES[Math.floor(Math.random() * ALL_SHAPES.length)];
  
  // Randomize enemy shapes each run from the 35 available shapes
  const shuffledEnemyShapes = [...ALL_SHAPES].sort(() => Math.random() - 0.5);
  let shapeIdx = 0;
  for (const k in ENEMIES) {
    ENEMIES[k].sides = shuffledEnemyShapes[shapeIdx++ % shuffledEnemyShapes.length];
  }
  
  pl = { x: 0, y: 0, hp: CFG.player.hp, xp: 0, level: 1, iv: 0, lv: {}, ws: {}, sides: pShape, face: 0, moving: false };
  P = { maxHp: CFG.player.hp, speed: CFG.player.speed, magnet: CFG.player.magnet, dmg: 1, cd: 1, regen: 0 };
  
  applyPalette();
  
  const allWeapons = Object.keys(WEAPONS);
  const startW = allWeapons[Math.floor(Math.random() * allWeapons.length)];
  pick(startW, 'w');
  
  hide(); state = 'play';
}

/* ============ UPDATE ============ */
function update(dt) {
  t += dt;
  const S = CFG.spawn, pr = pRad();
  let dx = (K.KeyD || K.ArrowRight ? 1 : 0) - (K.KeyA || K.ArrowLeft ? 1 : 0);
  let dy = (K.KeyS || K.ArrowDown ? 1 : 0) - (K.KeyW || K.ArrowUp ? 1 : 0);
  
  if (stick) { 
    dx += (stick.x - W / 2); 
    dy += (stick.y - H / 2); 
  }
  
  const m = Math.hypot(dx, dy); if (m > 1) { dx /= m; dy /= m; }
  pl.moving = m > .1; if (pl.moving) pl.face = Math.atan2(dy, dx);
  pl.x += dx * P.speed * dt; pl.y += dy * P.speed * dt; collide(pl, pRad());
  pl.iv -= dt; pl.hp = Math.min(P.maxHp, pl.hp + P.regen * dt);

  acc += dt * (S.base + S.ramp * t + CFG.scale.spawn * pl.level);
  while (acc >= 1 && enemies.length < Math.min(666, S.cap + pl.level * 4)) { acc--; spawn(pickType()); }
  if (acc > 1) acc = 1;
  if (t >= nextBoss) { spawn(ENEMIES.boss); nextBoss += S.bossEvery; }

  for (const e of enemies) {
    const a = Math.atan2(pl.y - e.y, pl.x - e.x), f = 1 - Math.min(1, 8 * dt);
    MOVES[e.type.move || 'chase'](e, a, dt);
    
    if (e.slowTimer > 0) {
      e.slowTimer -= dt;
    }
    const currentSpeedMult = e.slowTimer > 0 ? 0.5 : 1.0;
    
    e.x += (Math.cos(e.ma) * e.spd * e.sm * currentSpeedMult + e.kx) * dt;
    e.y += (Math.sin(e.ma) * e.spd * e.sm * currentSpeedMult + e.ky) * dt;
    if (!e.type.fly) collide(e, e.r);
    e.kx *= f; e.ky *= f; e.flash -= dt; e.oc -= dt; e.wmCooldown -= dt;
    e.rot = e.type.spin ? e.rot + e.type.spin * dt : e.ma;
  }
  gridBuild();
  for (const e of enemies) query(e.x, e.y, e.r, o => {
    if (o.id <= e.id) return;
    const ax = o.x - e.x, ay = o.y - e.y, d = Math.hypot(ax, ay), min = e.r + o.r;
    if (d < min && d > .01) { const p = (min - d) / d * .25; e.x -= ax * p; e.y -= ay * p; o.x += ax * p; o.y += ay * p; }
  });
  if (pl.iv <= 0) query(pl.x, pl.y, pr, e => {
    if (pl.iv <= 0 && Math.hypot(e.x - pl.x, e.y - pl.y) < e.r + pr) { pl.hp -= e.type.dmg * (1 + CFG.scale.dmg * pl.level); pl.iv = CFG.player.iframes; }
  });

  orbs.length = 0;
  for (const k in pl.ws) WEAPONS[k].tick(pl.ws[k], dt);

  for (let i = rings.length - 1; i >= 0; i--) {
    const g = rings[i]; g.x = pl.x; g.y = pl.y; g.r += 360 * dt;
    query(g.x, g.y, g.r, e => {
      if (g.hit.has(e) || Math.abs(Math.hypot(e.x - g.x, e.y - g.y) - g.r) > 14 + e.r) return;
      g.hit.add(e); hurt(e, g.dmg);
      const a = Math.atan2(e.y - g.y, e.x - g.x); e.kx += Math.cos(a) * 260; e.ky += Math.sin(a) * 260;
    });
    if (g.r > g.max) rings.splice(i, 1);
  }
  for (let i = zones.length - 1; i >= 0; i--) {
    const z = zones[i]; z.life -= dt; z.tk -= dt;
    if (z.turret) {
      z.fireT -= dt;
      if (z.fireT <= 0) {
        z.fireT = 0.4;
        const tg = nearest(z.x, z.y);
        if (tg) {
          const a = Math.atan2(tg.y - z.y, tg.x - z.x);
          projs.push({ x: z.x, y: z.y, vx: Math.cos(a)*400, vy: Math.sin(a)*400, sp: 400, r: 4, dmg: z.dmg, pierce: 1, life: 1.0, col: '--shot', hit: [], age: 0 });
        }
      }
    } else {
      if (z.tk <= 0) {
        z.tk = .3;
        query(z.x, z.y, z.r, e => {
          if (Math.hypot(e.x - z.x, e.y - z.y) < z.r + e.r) {
            hurt(e, z.dmg);
            if (z.slow) e.slowTimer = 0.5;
          }
        });
      }
      if (z.pull) {
        query(z.x, z.y, z.r * 1.5, e => {
          const dx = z.x - e.x, dy = z.y - e.y, d = Math.hypot(dx, dy) || 1;
          e.kx += (dx / d) * z.pull * dt;
          e.ky += (dy / d) * z.pull * dt;
        });
      }
    }
    if (z.life <= 0) zones.splice(i, 1);
  }
  
  for (let i = minesArr.length - 1; i >= 0; i--) {
    const m = minesArr[i];
    m.life -= dt;
    let triggered = false;
    if (m.life <= 0) triggered = true;
    else {
      query(m.x, m.y, m.trig, e => { if (Math.hypot(e.x - m.x, e.y - m.y) < m.trig + e.r) triggered = true; });
    }
    if (triggered) {
      burst(m.x, m.y, '--shot2', 8);
      blasts.push({ x: m.x, y: m.y, t: 0, fuse: 0.1, r: m.r, dmg: m.dmg });
      minesArr.splice(i, 1);
    }
  }

  for (const s of slashes) s.life -= dt;
  slashes = slashes.filter(s => s.life > 0); zaps = zaps.filter(z => (z.life -= dt) > 0);
  for (let i = blasts.length - 1; i >= 0; i--) {
    const b = blasts[i]; b.t += dt;
    if (!b.done && b.t >= b.fuse) {
      b.done = 1; burst(b.x, b.y, '--shot3', 10);
      query(b.x, b.y, b.r, e => { if (Math.hypot(e.x - b.x, e.y - b.y) < b.r + e.r) hurt(e, b.dmg); });
    }
    if (b.t >= b.fuse + .25) blasts.splice(i, 1);
  }
  for (let i = projs.length - 1; i >= 0; i--) {
    const p = projs[i]; p.age += dt;
    if (p.boom) {
      p.a += p.arcDir * dt;
      p.vx = Math.cos(p.a) * p.sp;
      p.vy = Math.sin(p.a) * p.sp;
    }
    if (p.home) {
      const tg = nearest(p.x, p.y);
      if (tg) {
        const a = Math.atan2(p.vy, p.vx), b = Math.atan2(tg.y - p.y, tg.x - p.x) - a, d = Math.atan2(Math.sin(b), Math.cos(b)), m = p.home * dt, na = a + Math.max(-m, Math.min(m, d));
        p.vx = Math.cos(na) * p.sp; p.vy = Math.sin(na) * p.sp;
      }
    }
    if (p.wander) {
      const a = Math.atan2(p.vy, p.vx) + Math.sin(p.age * 5) * dt * p.wander;
      p.vx = Math.cos(a) * p.sp; p.vy = Math.sin(a) * p.sp;
    }
    if (p.grav) p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
    let dead = (p.life -= dt) <= 0;
    if (!dead) query(p.x, p.y, p.r, e => {
      if (dead || p.hit.includes(e) || Math.hypot(e.x - p.x, e.y - p.y) > e.r + p.r) return;
      p.hit.push(e); hurt(e, p.dmg);
      if (p.bounce && p.pierce > 1) {
        p.pierce--;
        const next = nearest(p.x, p.y);
        if (next && next !== e) {
          const a = Math.atan2(next.y - p.y, next.x - p.x);
          p.vx = Math.cos(a) * p.sp; p.vy = Math.sin(a) * p.sp;
        }
      } else if (--p.pierce <= 0) dead = true;
    });
    if (dead) {
      if (p.explodes) {
        burst(p.x, p.y, '--shot2', 8);
        blasts.push({ x: p.x, y: p.y, t: 0, fuse: 0.05, r: p.explodeR || 45, dmg: p.dmg * 1.5 });
      }
      projs.splice(i, 1);
    }
  }
  for (let i = gems.length - 1; i >= 0; i--) {
    const g = gems[i], ax = pl.x - g.x, ay = pl.y - g.y, d = Math.hypot(ax, ay) || 1;
    if (d < P.magnet) g.m = 1;
    if (g.m) { g.x += ax / d * 380 * dt; g.y += ay / d * 380 * dt; }
    if (d < pr + 5) { pl.xp += g.v; gems.splice(i, 1); }
  }
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.x += p.vx * dt; p.y += p.vy * dt; if ((p.life -= dt) <= 0) parts.splice(i, 1); }
  enemies = enemies.filter(e => !e.dead);

  if (pl.hp <= 0) return end();
  if (pl.xp >= need()) { pl.xp -= need(); pl.level++; state = 'levelup'; offer(); }
}

/* ============ DRAW ============ */
function polyPath(x, y, r, n, rot, c = ctx) {
  c.beginPath();
  if (!n || n === 'circle') {
    c.arc(x, y, r, 0, TAU);
  } else if (typeof n === 'number') {
    for (let i = 0; i < n; i++) {
      const a = rot + i * TAU / n, px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
      i ? c.lineTo(px, py) : c.moveTo(px, py);
    }
    c.closePath();
  } else if (n === 'boom') {
    c.moveTo(x + Math.cos(rot)*r, y + Math.sin(rot)*r);
    c.lineTo(x + Math.cos(rot + 2.2)*r, y + Math.sin(rot + 2.2)*r);
    c.lineTo(x + Math.cos(rot + Math.PI)*r*0.2, y + Math.sin(rot + Math.PI)*r*0.2);
    c.lineTo(x + Math.cos(rot - 2.2)*r, y + Math.sin(rot - 2.2)*r);
    c.closePath();
  } else if (n === 'star') {
    for (let i = 0; i < 10; i++) {
      const a = rot + i * Math.PI / 5, sr = (i % 2 === 0) ? r : r * 0.42;
      const px = x + Math.cos(a) * sr, py = y + Math.sin(a) * sr;
      i ? c.lineTo(px, py) : c.moveTo(px, py);
    }
    c.closePath();
  } else if (n === 'cross') {
    const w = r * 0.35;
    const pts = [[r, w], [w, w], [w, r], [-w, r], [-w, w], [-r, w], [-r, -w], [-w, -w], [-w, -r], [w, -r], [w, -w], [r, -w]];
    const cos = Math.cos(rot), sin = Math.sin(rot);
    pts.forEach(([px, py], i) => {
      const rx = x + px * cos - py * sin, ry = y + px * sin + py * cos;
      i ? c.lineTo(rx, ry) : c.moveTo(rx, ry);
    });
    c.closePath();
  } else if (n === 'trapezoid') {
    const rCW = rot + Math.PI / 2;
    const pts = [[r * 0.5, -r * 0.8], [r, r * 0.8], [-r, r * 0.8], [-r * 0.5, -r * 0.8]];
    const cos = Math.cos(rCW), sin = Math.sin(rCW);
    pts.forEach(([px, py], i) => {
      const rx = x + px * cos - py * sin, ry = y + px * sin + py * cos;
      i ? c.lineTo(rx, ry) : c.moveTo(rx, ry);
    });
    c.closePath();
  } else if (n === 'house') {
    const rCW = rot + Math.PI / 2;
    const pts = [[0, -r], [r * 0.85, -r * 0.1], [r * 0.7, r * 0.85], [-r * 0.7, r * 0.85], [-r * 0.85, -r * 0.1]];
    const cos = Math.cos(rCW), sin = Math.sin(rCW);
    pts.forEach(([px, py], i) => {
      const rx = x + px * cos - py * sin, ry = y + px * sin + py * cos;
      i ? c.lineTo(rx, ry) : c.moveTo(rx, ry);
    });
    c.closePath();
  } else if (n === 'arrow') {
    const pts = [[r * 1.1, 0], [-r * 0.7, r * 0.7], [-r * 0.3, 0], [-r * 0.7, -r * 0.7]];
    const cos = Math.cos(rot), sin = Math.sin(rot);
    pts.forEach(([px, py], i) => {
      const rx = x + px * cos - py * sin, ry = y + px * sin + py * cos;
      i ? c.lineTo(rx, ry) : c.moveTo(rx, ry);
    });
    c.closePath();
  } else if (n === 'ghost') {
    const rCW = rot + Math.PI / 2;
    const cos = Math.cos(rCW), sin = Math.sin(rCW);
    const tr = (px, py) => [x + px * cos - py * sin, y + px * sin + py * cos];
    const [p0x, p0y] = tr(-r * 0.8, 0); c.moveTo(p0x, p0y);
    const [c1x, c1y] = tr(-r * 0.8, -r * 1.1), [c2x, c2y] = tr(r * 0.8, -r * 1.1), [p1x, p1y] = tr(r * 0.8, 0);
    c.bezierCurveTo(c1x, c1y, c2x, c2y, p1x, p1y);
    const skirt = [[r * 0.8, r * 0.8], [r * 0.4, r * 0.4], [0, r * 0.8], [-r * 0.4, r * 0.4], [-r * 0.8, r * 0.8]];
    skirt.forEach(([px, py]) => { const [rx, ry] = tr(px, py); c.lineTo(rx, ry); });
    c.closePath();
  } else if (n === 'diamond') {
    const rotCW = rot + Math.PI / 2;
    const pts = [[0, -r * 1.25], [r * 0.75, 0], [0, r * 1.25], [-r * 0.75, 0]];
    const cos = Math.cos(rotCW), sin = Math.sin(rotCW);
    pts.forEach(([px, py], i) => {
      const rx = x + px * cos - py * sin, ry = y + px * sin + py * cos;
      i ? c.lineTo(rx, ry) : c.moveTo(rx, ry);
    });
    c.closePath();
  } else if (n === 'crescent') {
    const cos = Math.cos(rot), sin = Math.sin(rot);
    const tr = (px, py) => [x + px * cos - py * sin, y + px * sin + py * cos];
    const [p0x, p0y] = tr(0, -r * 1.1);
    const [c1x, c1y] = tr(r * 1.3, 0);
    const [p1x, p1y] = tr(0, r * 1.1);
    const [c2x, c2y] = tr(r * 0.45, 0);
    c.moveTo(p0x, p0y);
    c.quadraticCurveTo(c1x, c1y, p1x, p1y);
    c.quadraticCurveTo(c2x, c2y, p0x, p0y);
    c.closePath();
  } else if (n === 'heart') {
    const rotCW = rot + Math.PI / 2;
    const cos = Math.cos(rotCW), sin = Math.sin(rotCW);
    for (let i = 0; i <= 36; i++) {
      const a = (i / 36) * TAU;
      const px = r * 0.8 * Math.sin(a) ** 3;
      const py = -r * 0.7 * (13 * Math.cos(a) - 5 * Math.cos(2*a) - 2 * Math.cos(3*a) - Math.cos(4*a)) / 16;
      const rx = x + px * cos - py * sin, ry = y + px * sin + py * cos;
      i ? c.lineTo(rx, ry) : c.moveTo(rx, ry);
    }
    c.closePath();
  } else if (n === 'shield') {
    const rotCW = rot + Math.PI / 2;
    const pts = [[0, -r], [r * 0.85, -r * 0.85], [r * 0.85, 0], [0, r * 1.1], [-r * 0.85, 0], [-r * 0.85, -r * 0.85]];
    const cos = Math.cos(rotCW), sin = Math.sin(rotCW);
    pts.forEach(([px, py], i) => {
      const rx = x + px * cos - py * sin, ry = y + px * sin + py * cos;
      i ? c.lineTo(rx, ry) : c.moveTo(rx, ry);
    });
    c.closePath();
  } else if (n === 'drop') {
    const rotCCW = rot - Math.PI / 2;
    const cos = Math.cos(rotCCW), sin = Math.sin(rotCCW);
    const tr = (px, py) => [x + px * cos - py * sin, y + px * sin + py * cos];
    const [tX, tY] = tr(0, -r * 1.15);
    const [bX, bY] = tr(0, r * 0.95);
    const [rcX, rcY] = tr(r * 1.1, r * 0.3);
    const [lcX, lcY] = tr(-r * 1.1, r * 0.3);
    c.moveTo(tX, tY);
    c.quadraticCurveTo(rcX, rcY, bX, bY);
    c.quadraticCurveTo(lcX, lcY, tX, tY);
    c.closePath();
  } else if (n === 'hourglass') {
    const pts = [[-r * 0.75, -r * 0.95], [r * 0.75, -r * 0.95], [-r * 0.15, 0], [r * 0.75, r * 0.95], [-r * 0.75, r * 0.95], [r * 0.15, 0]];
    const cos = Math.cos(rot), sin = Math.sin(rot);
    pts.forEach(([px, py], i) => {
      const rx = x + px * cos - py * sin, ry = y + px * sin + py * cos;
      i ? c.lineTo(rx, ry) : c.moveTo(rx, ry);
    });
    c.closePath();
  } else if (n === 'clover') {
    const cos = Math.cos(rot), sin = Math.sin(rot);
    for (let i = 0; i <= 48; i++) {
      const a = (i / 48) * TAU, cr = r * (0.6 + 0.4 * Math.abs(Math.sin(2 * a))), px = cr * Math.cos(a), py = cr * Math.sin(a);
      const rx = x + px * cos - py * sin, ry = y + px * sin + py * cos;
      i ? c.lineTo(rx, ry) : c.moveTo(rx, ry);
    }
    c.closePath();
  } else if (n === 'gear') {
    const teeth = 8;
    const cos = Math.cos(rot), sin = Math.sin(rot);
    for (let i = 0; i < teeth * 2; i++) {
      const a = i * Math.PI / teeth;
      const gr = (i % 2 === 0) ? r * 1.1 : r * 0.7;
      const px = gr * Math.cos(a), py = gr * Math.sin(a);
      const rx = x + px * cos - py * sin, ry = y + px * sin + py * cos;
      i ? c.lineTo(rx, ry) : c.moveTo(rx, ry);
    }
    c.closePath();
  } else if (n === 'capsule') {
    const cos = Math.cos(rot), sin = Math.sin(rot);
    const w = r * 1.1, h = r * 0.55;
    const pts = [];
    for (let i = 0; i <= 12; i++) {
      const a = -Math.PI / 2 + (i / 12) * Math.PI;
      pts.push([w / 2 + Math.cos(a) * h, Math.sin(a) * h]);
    }
    for (let i = 0; i <= 12; i++) {
      const a = Math.PI / 2 + (i / 12) * Math.PI;
      pts.push([-w / 2 + Math.cos(a) * h, Math.sin(a) * h]);
    }
    pts.forEach(([px, py], i) => {
      const rx = x + px * cos - py * sin, ry = y + px * sin + py * cos;
      i ? c.lineTo(rx, ry) : c.moveTo(rx, ry);
    });
    c.closePath();
  } else if (n === 'infinity') {
    const cos = Math.cos(rot), sin = Math.sin(rot);
    for (let i = 0; i <= 36; i++) {
      const a = (i / 36) * TAU;
      const denom = 1 + Math.sin(a) ** 2;
      const px = (r * 1.2 * Math.cos(a)) / denom;
      const py = (r * 1.2 * Math.sin(a) * Math.cos(a)) / denom;
      const rx = x + px * cos - py * sin, ry = y + px * sin + py * cos;
      i ? c.lineTo(rx, ry) : c.moveTo(rx, ry);
    }
    c.closePath();
  } else if (n === 'spade') {
    const rotCW = rot + Math.PI / 2;
    const cos = Math.cos(rotCW), sin = Math.sin(rotCW);
    const tr = (px, py) => [x + px * cos - py * sin, y + px * sin + py * cos];
    const [tX, tY] = tr(0, -r * 1.15);
    c.moveTo(tX, tY);
    const [c1x, c1y] = tr(r * 1.1, -r * 0.5);
    const [c2x, c2y] = tr(r * 1.1, r * 0.4);
    const [n1x, n1y] = tr(r * 0.12, r * 0.35);
    c.bezierCurveTo(c1x, c1y, c2x, c2y, n1x, n1y);
    const [s1x, s1y] = tr(r * 0.3, r * 0.95);
    const [s2x, s2y] = tr(-r * 0.3, r * 0.95);
    const [n2x, n2y] = tr(-r * 0.12, r * 0.35);
    c.lineTo(s1x, s1y);
    c.lineTo(s2x, s2y);
    c.lineTo(n2x, n2y);
    const [c3x, c3y] = tr(-r * 1.1, r * 0.4);
    const [c4x, c4y] = tr(-r * 1.1, -r * 0.5);
    c.bezierCurveTo(c3x, c3y, c4x, c4y, tX, tY);
    c.closePath();
  } else if (n === 'club') {
    const cos = Math.cos(rot), sin = Math.sin(rot);
    for (let i = 0; i <= 48; i++) {
      const a = (i / 48) * TAU;
      const cr = r * (0.5 + 0.35 * Math.cos(3 * a));
      const px = cr * Math.cos(a), py = cr * Math.sin(a);
      const rx = x + px * cos - py * sin, ry = y + px * sin + py * cos;
      i ? c.lineTo(rx, ry) : c.moveTo(rx, ry);
    }
    c.closePath();
  } else if (n === 'flower') {
    const cos = Math.cos(rot), sin = Math.sin(rot);
    for (let i = 0; i <= 60; i++) {
      const a = (i / 60) * TAU, fr = r * (0.55 + 0.45 * Math.abs(Math.sin(2.5 * a))), px = fr * Math.cos(a), py = fr * Math.sin(a);
      const rx = x + px * cos - py * sin, ry = y + px * sin + py * cos;
      i ? c.lineTo(rx, ry) : c.moveTo(rx, ry);
    }
    c.closePath();
  } else if (n === 'star4') {
    for (let i = 0; i < 8; i++) {
      const a = rot + i * Math.PI / 4, sr = (i % 2 === 0) ? r * 1.15 : r * 0.3;
      const px = x + Math.cos(a) * sr, py = y + Math.sin(a) * sr;
      i ? c.lineTo(px, py) : c.moveTo(px, py);
    }
    c.closePath();
  } else if (n === 'star6') {
    for (let i = 0; i < 12; i++) {
      const a = rot + i * Math.PI / 6, sr = (i % 2 === 0) ? r : r * 0.5;
      const px = x + Math.cos(a) * sr, py = y + Math.sin(a) * sr;
      i ? c.lineTo(px, py) : c.moveTo(px, py);
    }
    c.closePath();
  } else if (n === 'astroid') {
    const cos = Math.cos(rot), sin = Math.sin(rot);
    for (let i = 0; i <= 36; i++) {
      const a = (i / 36) * TAU;
      const px = r * (Math.cos(a) ** 3), py = r * (Math.sin(a) ** 3);
      const rx = x + px * cos - py * sin, ry = y + px * sin + py * cos;
      i ? c.lineTo(rx, ry) : c.moveTo(rx, ry);
    }
    c.closePath();
  } else if (n === 'blade') {
    const cos = Math.cos(rot), sin = Math.sin(rot);
    const pts = [[r * 1.2, 0], [0, r * 0.6], [-r * 0.8, 0], [0, -r * 0.2]];
    pts.forEach(([px, py], i) => {
      const rx = x + px * cos - py * sin, ry = y + px * sin + py * cos;
      i ? c.lineTo(rx, ry) : c.moveTo(rx, ry);
    });
    c.closePath();
  } else if (n === 'ring') {
    c.arc(x, y, r, 0, TAU, false);
    c.arc(x, y, r * 0.5, 0, TAU, true);
    c.closePath();
  }
}

function poly(x, y, r, n, rot) {
  polyPath(x, y, r, n, rot);
  ctx.fill();
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = C['--bg']; ctx.fillRect(0, 0, W, H);
  if (!pl) return;
  const cx = Math.round(pl.x - W / 2), cy = Math.round(pl.y - H / 2);

  ctx.save(); ctx.translate(-cx, -cy);
  
  // Solid Terrain Layer (Obstacles)
  ctx.fillStyle = C['--obstacle'];
  for (let i = Math.floor(cx / CHUNK); i <= Math.floor((cx + W) / CHUNK); i++) {
    for (let j = Math.floor(cy / CHUNK); j <= Math.floor((cy + H) / CHUNK); j++) {
      for (const b of chunkAt(i, j)) {
        if (b.type === 'circle') {
          poly(b.x, b.y, b.r, 0);
        } else {
          ctx.fillRect(b.x, b.y, b.w, b.h);
        }
      }
    }
  }
  
  for (const z of zones) {
    if (z.turret) {
      ctx.fillStyle = C['--shot3']; poly(z.x, z.y, z.r, 4, t * 2);
    } else {
      ctx.globalAlpha = Math.min(.55, z.life / z.max);
      ctx.fillStyle = z.slow ? C['--shot2'] : C['--shot3'];
      poly(z.x, z.y, z.r * (.85 + .15 * Math.sin(t * 14 + z.x)), 0);
    }
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = C['--gem']; for (const g of gems) poly(g.x, g.y, 4, 4, Math.PI / 4);
  for (const e of enemies) { ctx.fillStyle = e.flash > 0 ? C['--flash'] : C[e.type.col]; poly(e.x, e.y, e.r, e.type.sides, e.rot); }
  for (const p of projs) { ctx.fillStyle = C[p.col]; poly(p.x, p.y, p.r, p.sides || 0, p.spin ? p.age * p.spin : p.rot || 0); }
  for (const b of blasts) {
    const s = b.shape || 0;
    if (b.t < b.fuse) {
      ctx.fillStyle = C['--shot3']; poly(b.x, b.y, 6 + 3 * Math.sin(b.t * 30), s, 0);
      ctx.globalAlpha = .3; ctx.strokeStyle = C['--shot3']; ctx.lineWidth = 2;
      polyPath(b.x, b.y, b.r, s, 0); ctx.stroke(); ctx.globalAlpha = 1;
    } else {
      ctx.globalAlpha = Math.max(0, 1 - (b.t - b.fuse) / .25) * .6;
      ctx.fillStyle = C['--shot3']; poly(b.x, b.y, b.r, s, 0); ctx.globalAlpha = 1;
    }
  }
  for (const s of slashes) { ctx.globalAlpha = s.life / s.max * .6; ctx.fillStyle = C[s.col]; ctx.beginPath(); ctx.moveTo(pl.x, pl.y); ctx.arc(pl.x, pl.y, s.range, s.a - s.arc / 2, s.a + s.arc / 2); ctx.closePath(); ctx.fill(); }
  
  for (const z of zaps) { 
    ctx.globalAlpha = z.life / (z.max || .2); ctx.strokeStyle = C[z.col]; ctx.lineWidth = z.width || 3; 
    ctx.beginPath(); z.pts.forEach(([x, y], i) => i ? ctx.lineTo(x + (z.jit ? rnd(-6, 6) : 0), y + (z.jit ? rnd(-6, 6) : 0)) : ctx.moveTo(x, y)); ctx.stroke(); 
  }
  ctx.globalAlpha = 1; ctx.lineWidth = 3;
  
  ctx.fillStyle = C['--shot2']; for (const m of minesArr) poly(m.x, m.y, 8, 3, t * 3);
  
  ctx.fillStyle = C['--shot']; for (const o of orbs) poly(o.x, o.y, o.r, 0);
  ctx.strokeStyle = C['--shot']; ctx.lineWidth = 4;
  for (const g of rings) { ctx.globalAlpha = Math.max(0, 1 - g.r / g.max); ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, TAU); ctx.stroke(); }
  
  if (pl.ws.aura) {
    ctx.globalAlpha = 0.2; ctx.fillStyle = C['--shot3'];
    poly(pl.x, pl.y, 65 + 15 * pl.ws.aura.lv, 0);
  }
  
  // Render Windmill Katana Blades
  if (pl.ws.windmill) {
    const wm = pl.ws.windmill;
    const n = 3, R = 55 + 7.5 * wm.lv, bw = 12 + 2 * wm.lv;
    for (let i = 0; i < n; i++) {
      const a = wm.a + i * TAU / n;
      ctx.save();
      ctx.translate(pl.x, pl.y);
      ctx.rotate(a);
      ctx.globalAlpha = 0.75;
      ctx.fillStyle = C['--shot2'];
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, -bw * 0.3);
      ctx.quadraticCurveTo(R * 0.75, -bw * 0.5, R, 0);
      ctx.lineTo(R * 0.88, bw * 0.4);
      ctx.quadraticCurveTo(R * 0.4, bw * 0.4, 0, bw * 0.3);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
  }

  // Render Mace (Spiked Ball & Chain)
  if (pl.ws.mace) {
    const wb = pl.ws.mace;
    const r = 120 + 20 * wb.lv;
    const ballR = 16 + 3 * wb.lv;
    const mx = pl.x + Math.cos(wb.a) * r, my = pl.y + Math.sin(wb.a) * r;
    
    // Draw Chain Links
    ctx.strokeStyle = C['--fg'];
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(pl.x, pl.y);
    ctx.lineTo(mx, my);
    ctx.stroke();
    ctx.setLineDash([]);
    
    // Draw Spiked Ball
    ctx.fillStyle = C['--shot3'];
    ctx.strokeStyle = C['--fg'];
    ctx.lineWidth = 2;
    polyPath(mx, my, ballR, 'star', wb.a * 3);
    ctx.fill();
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  
  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life * 2.5); ctx.fillStyle = C[p.col]; poly(p.x, p.y, 2.5, 0); }
  ctx.globalAlpha = pl.iv > 0 && ((t * 20) | 0) % 2 ? .4 : 1;
  ctx.fillStyle = C['--player']; poly(pl.x, pl.y, pRad(), pl.sides, pl.face);
  ctx.globalAlpha = 1;
  ctx.restore();

  ctx.fillStyle = C['--obstacle']; ctx.fillRect(0, 0, W, 8);
  ctx.fillStyle = C['--gem']; ctx.fillRect(0, 0, W * Math.min(1, pl.xp / need()), 8);
  ctx.fillStyle = C['--fg']; ctx.font = '600 14px system-ui,sans-serif'; ctx.textBaseline = 'top';
  ctx.textAlign = 'left'; ctx.fillText('LV ' + pl.level + '   HP ' + Math.ceil(Math.max(0, pl.hp)) + '/' + P.maxHp, 10, 16);
  ctx.textAlign = 'center'; ctx.fillText(fmt(t), W / 2, 16);
  ctx.textAlign = 'right'; ctx.fillText(kills + ' kills', W - 10, 16);
}

/* ============ INPUT & LOOP ============ */
function resize() { dpr = Math.min(devicePixelRatio || 1, 2); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; }
addEventListener('resize', resize);
addEventListener('keydown', e => {
  K[e.code] = 1;
  if (state === 'levelup') {
    const m = e.code.match(/^(?:Digit|Numpad)([1-3])$/) || (e.key >= '1' && e.key <= '3' ? [null, e.key] : null);
    if (m) choose(+m[1] - 1);
  }
  else if (state === 'menu' && (e.code === 'Enter' || e.code === 'Space')) start();
  else if (state === 'over' && (e.code === 'Enter' || e.code === 'Space')) start();
  else if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => K[e.code] = 0);
addEventListener('blur', () => { if (state === 'play') togglePause(); });
const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };

cv.addEventListener('pointerdown', e => {
  if (state !== 'play' || stick) return;
  const [x, y] = pos(e); stick = { id: e.pointerId, x, y }; cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => { if (stick && e.pointerId === stick.id) [stick.x, stick.y] = pos(e); });
const endStick = e => { if (stick && e.pointerId === stick.id) stick = null; };
cv.addEventListener('pointerup', endStick); cv.addEventListener('pointercancel', endStick);
ov.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.i !== undefined) choose(+b.dataset.i); 
  else if (b.dataset.act === 'restart' || b.dataset.act === 'start') start();
  else if (b.dataset.act === 'resume') togglePause(); 
  else if (b.dataset.act === 'gallery') showGallery();
  else menu();
});

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (state === 'play') update(dt);
  else if (state === 'gallery') renderGalleryPreviews();
  draw(); requestAnimationFrame(frame);
}
resize(); readColors(); menu(); requestAnimationFrame(frame);
</script>
